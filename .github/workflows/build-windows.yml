name: GardenVault Windows x64 build

on:
  push:
    branches:
      - build/ldplayer-reader-mvp
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'ui/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'build_windows.bat'
      - '.github/workflows/build-windows.yml'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gardenvault-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund
      - name: Run frontend tests
        run: npm test
      - name: Generate application icons
        run: npm run tauri -- icon src-tauri/icons/gardenvault.svg
      - name: Format Rust source
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Lint Rust (clippy, warnings are errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Install and expose NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsisDirs = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS'),
            (Join-Path $env:ProgramFiles 'NSIS'),
            (Join-Path $env:ProgramData 'chocolatey/bin')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $makensis) {
            $installed = $false
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              Write-Host "Installing NSIS with Chocolatey (attempt $attempt of 4)."
              choco install nsis --no-progress -y --execution-timeout=1800
              $installExitCode = $LASTEXITCODE
              if ($installExitCode -eq 0) {
                $installed = $true
                break
              }
              if ($attempt -lt 4) {
                $delay = $attempt * 20
                Write-Warning "NSIS installation failed with exit code $installExitCode. Retrying in $delay seconds."
                Start-Sleep -Seconds $delay
              }
            }
            if (-not $installed) {
              throw "Chocolatey could not install NSIS after 4 attempts (last exit code $installExitCode)."
            }
            $nsisDirs = @(
              (Join-Path ${env:ProgramFiles(x86)} 'NSIS'),
              (Join-Path $env:ProgramFiles 'NSIS'),
              (Join-Path $env:ProgramData 'chocolatey/bin')
            ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          }
          $found = $null
          foreach ($dir in $nsisDirs) {
            $candidate = Join-Path $dir 'makensis.exe'
            if (Test-Path -LiteralPath $candidate) {
              $found = $candidate
              $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH = "$dir;$env:PATH"
              break
            }
          }
          if (-not $found) {
            $cmd = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($cmd) { $found = $cmd.Source }
          }
          if (-not $found) { throw 'Could not locate makensis.exe after installing NSIS.' }
          & $found /VERSION
      - name: Build Windows app and NSIS installer
        run: npm run tauri:build
      - name: Verify build outputs
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/gardenvault.exe'
          $installerDir = 'src-tauri/target/release/bundle/nsis'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'GardenVault.exe was not generated.' }
          $installers = @(Get-ChildItem -LiteralPath $installerDir -Filter '*-setup.exe' -File)
          if ($installers.Count -eq 0) { throw 'The NSIS setup executable was not generated.' }
          Get-FileHash -Algorithm SHA256 $exe
          $installers | ForEach-Object { Get-FileHash -Algorithm SHA256 $_.FullName }
      - name: Upload unsigned Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GardenVault-v1.0.0-rc.12-Windows-x64-unsigned
          path: |
            src-tauri/target/release/gardenvault.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
