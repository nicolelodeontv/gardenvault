name: GardenVault Windows x64 build

on:
  push:
    branches:
      - build/ldplayer-reader-mvp
    paths:
      - 'package.json'
      - 'ui/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'build_windows.bat'
      - '.github/workflows/build-windows.yml'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gardenvault-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress -y
          }
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            throw 'NSIS is required for the Windows installer.'
          }
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Run frontend tests
        run: npm test
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Generate application icons
        run: npm run tauri -- icon src-tauri/icons/gardenvault.svg
      - name: Build Windows app and NSIS installer
        run: npm run tauri:build
      - name: Verify build outputs
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/gardenvault.exe'
          $installerDir = 'src-tauri/target/release/bundle/nsis'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'GardenVault.exe was not generated.' }
          $installers = @(Get-ChildItem -LiteralPath $installerDir -Filter '*-setup.exe' -File)
          if ($installers.Count -eq 0) { throw 'The NSIS setup executable was not generated.' }
          Get-FileHash -Algorithm SHA256 $exe
          $installers | ForEach-Object { Get-FileHash -Algorithm SHA256 $_.FullName }
      - name: Upload unsigned Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GardenVault-v1.0.0-rc.3-Windows-x64-unsigned
          path: |
            src-tauri/target/release/gardenvault.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
